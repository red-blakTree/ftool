name: Build RPM

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 发布策略（按触发方式区分）：
# - push 到 main（自动构建）→ 预发行版：tag 为 vX.Y.Z-dev.<run_number>，
#   每次构建一个独立条目，绝不修改既有发行
# - workflow_dispatch（手动构建）→ 普通发行版：tag 为 vX.Y.Z；
#   该版本的正式发行已存在时构建显式失败（请先升级 Cargo.toml 版本号）
# - 同一 ref + 同一触发方式的并发构建会取消旧的在途构建（手动正式发行不会被 push 取消）
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Generate RPM
        run: cargo generate-rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftool-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

      # 判定本次构建的发行类型与 tag（只读远程，无副作用）
      - name: Resolve release kind
        id: kind
        run: |
          set -euo pipefail
          VERSION=$(awk '/^\[package\]/{f=1} f && /^version *=/{gsub(/[" ,]/, "", $3); print $3; exit}' Cargo.toml)
          TAG="v${VERSION}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发 → 普通发行版。同版本已有正式发行时显式失败：既不覆盖既有
            # 发行，也不另造 tag，请先升级 Cargo.toml 版本号再手动触发
            if gh release view "${TAG}" --json tagName >/dev/null 2>&1; then
              echo "::error::正式发行 ${TAG} 已存在，请先在 Cargo.toml 中升级版本号"
              exit 1
            fi
            KIND="release"
          else
            # push 自动触发 → 预发行版，tag 带构建号保证每次唯一
            KIND="prerelease"
            TAG="${TAG}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "触发方式 ${{ github.event_name }} → 发行类型: ${KIND} (tag: ${TAG})"

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          KIND="${{ steps.kind.outputs.kind }}"
          TAG="${{ steps.kind.outputs.tag }}"
          VERSION="${{ steps.kind.outputs.version }}"
          if [ "${KIND}" = "release" ]; then
            gh release create "${TAG}" \
              --target "${{ github.sha }}" \
              --title "ftool v${VERSION}" \
              --notes "正式发行 v${VERSION}（手动触发）。

            下载 RPM 后安装：
            sudo dnf install ./ftool-*.rpm" \
              target/generate-rpm/*.rpm
          else
            gh release create "${TAG}" \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "ftool v${VERSION} 预发行 #${{ github.run_number }}" \
              --notes "预发行构建（push 自动触发，commit ${{ github.sha }}）。

            每次构建生成独立条目，不修改已存在的任何发行。
            下载 RPM 后安装：
            sudo dnf install ./ftool-*.rpm" \
              target/generate-rpm/*.rpm
          fi
