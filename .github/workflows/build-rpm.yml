name: Build RPM

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Generate RPM
        run: cargo generate-rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftool-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

      # 正式发布：打 v* tag 时创建对应版本的 GitHub Release
      - name: Publish GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/generate-rpm/*.rpm
          generate_release_notes: true

      # 滚动发布：push 到 main 时删除旧 Release 并用 gh 重建，
      # 使固定 tag "latest" 始终指向最新构建，RPM 附件每次覆盖
      - name: Publish rolling Release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create latest \
            --title "ftool 最新构建 (${{ github.sha }})" \
            --notes "main 分支自动构建于 commit ${{ github.sha }}（$(date -u +%Y-%m-%dT%H:%MZ)）。
            
            下载 RPM 后安装：
            sudo dnf install ./ftool-*.rpm" \
            --target "${{ github.sha }}" \
            target/generate-rpm/*.rpm
