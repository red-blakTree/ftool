name: Build RPM

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 发布策略：
# - 每次 main push 读取 Cargo.toml 版本号，与已发布的正式 Release 比对：
#   * 版本号变化（如 0.1.2 → 0.1.3，尚无 v0.1.3 正式 Release）→ 创建正式发行
#   * 版本号未变化（vX.Y.Z 已正式发布过）→ 创建独立命名的预发行
#     vX.Y.Z-dev.<run_number>，每次构建一个全新条目，绝不修改既有发行
# - 同 ref 的并发 push 会取消旧的在途构建，只保留最新
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Generate RPM
        run: cargo generate-rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftool-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

      # 判定本次构建的发行类型与 tag（只读远程，无副作用）
      - name: Resolve release kind
        id: kind
        run: |
          set -euo pipefail
          VERSION=$(awk '/^\[package\]/{f=1} f && /^version *=/{gsub(/[" ,]/, "", $3); print $3; exit}' Cargo.toml)
          TAG="v${VERSION}"
          if gh release view "${TAG}" --json tagName >/dev/null 2>&1; then
            # 版本号未变化：该版本已有正式发行 → 预发行，tag 带构建号保证每次唯一
            KIND="prerelease"
            TAG="${TAG}-dev.${GITHUB_RUN_NUMBER}"
          else
            # 版本号变化：尚无该版本的正式发行 → 正式发行
            KIND="release"
          fi
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "检测到 Cargo.toml 版本 ${VERSION} → 发行类型: ${KIND} (tag: ${TAG})"

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          KIND="${{ steps.kind.outputs.kind }}"
          TAG="${{ steps.kind.outputs.tag }}"
          VERSION="${{ steps.kind.outputs.version }}"
          if [ "${KIND}" = "release" ]; then
            gh release create "${TAG}" \
              --target "${{ github.sha }}" \
              --title "ftool v${VERSION}" \
              --notes "正式发行 v${VERSION}（Cargo.toml 版本号变更触发）。

            下载 RPM 后安装：
            sudo dnf install ./ftool-*.rpm" \
              target/generate-rpm/*.rpm
          else
            gh release create "${TAG}" \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "ftool v${VERSION} 预发行 #${{ github.run_number }}" \
              --notes "预发行构建（v${VERSION} 已正式发布，本次为版本号未变化的持续构建，commit ${{ github.sha }}）。

            每次构建生成独立条目，不修改已存在的任何发行。
            下载 RPM 后安装：
            sudo dnf install ./ftool-*.rpm" \
              target/generate-rpm/*.rpm
          fi
