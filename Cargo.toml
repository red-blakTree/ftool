[package]
name = "ftool"
version = "0.1.1"
edition = "2024"
description = "Fedora system utility for NVIDIA Optimus GPU switching"
license = "GPL-3.0-or-later"
homepage = "https://github.com/red-blakTree/ftool"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/ftool", dest = "/usr/bin/ftool", mode = "755" },
    { source = "completions/ftool.bash", dest = "/usr/share/bash-completion/completions/ftool", mode = "644" },
    { source = "completions/ftool.fish", dest = "/usr/share/fish/vendor_completions.d/ftool.fish", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/ftool/LICENSE", mode = "644" },
]

[dependencies]
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
digest = "0.11.3"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0.18"
